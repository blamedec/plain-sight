/* Layout: a fixed 318 x 496 game panel. The pixel picture fills all of it; rounded, chunky controls float on top. */
:root {
  --page: #ECE9F2; --page-ink: #1D1A2B; --page-soft: #625C78; --page-line: #CFC9DD; --page-hover: #E1DCEA; --page-field: #FFFFFF;
  --ink: #1D1A2B; --soft: #625C78; --paper: #FFFFFF; --mist: #F0EDF6; --edge: #D5CFE4;
  --go: #5BD64A; --go-edge: #2F9A2F; --go-ink: #0F2A0C; --go-tint: #E4F8DF;
  --gold: #FFC53A; --gold-edge: #CF8B12; --miss: #FF5A4E; --warn: #D9730D;
  --common: #8E9AAD; --rare: #3D86F5; --epic: #A94BF2; --legendary: #F28A12;
  --ui: Fredoka, "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --num: Silkscreen, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #15131C; --page-ink: #ECE9F5; --page-soft: #A6A0BC; --page-line: #3A3548; --page-hover: #221F2B; --page-field: #0E0C14; color-scheme: dark; } }
:root[data-theme="dark"] { --page: #15131C; --page-ink: #ECE9F5; --page-soft: #A6A0BC; --page-line: #3A3548; --page-hover: #221F2B; --page-field: #0E0C14; color-scheme: dark; }
html, body { background: var(--page); color: var(--page-ink); }
body { margin: 0; font: 500 14px/1.4 var(--ui); -webkit-font-smoothing: antialiased; }
*, *::before, *::after { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
[hidden] { display: none !important; }

/* the demo page round the panel */
.wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding-block: 20px 28px; padding-inline: 16px; }
.demo { width: 318px; max-width: 100%; display: flex; flex-direction: column; gap: 6px; }
.seg { display: grid; grid-template-columns: 1fr 1fr 1fr; height: 32px; border: 1.5px solid var(--page-line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; border-left: 1.5px solid var(--page-line); background: transparent; color: var(--page-ink); font: 600 12.5px/1 var(--ui); cursor: pointer; }
.seg button:first-child { border-left: 0; }
.seg button.primary { background: var(--page-ink); color: var(--page); }
.seg button:focus-visible, .chan input:focus-visible { outline: 2px solid var(--page-ink); outline-offset: -3px; }
@media (hover: hover) { .seg button:not(.primary):hover { background: var(--page-hover); } .seg button.primary:hover { opacity: .88; } }
.demo-row { display: flex; gap: 6px; height: 32px; }
.demo-day { display: inline-flex; align-items: center; padding: 0 11px; border-radius: 10px; border: 1.5px solid var(--page-line); font-size: 12.5px; font-weight: 600; color: var(--page-soft); white-space: nowrap; }
.chan { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 0 3px 0 11px; border-radius: 10px; border: 1.5px solid var(--page-line); font-size: 12.5px; font-weight: 600; color: var(--page-soft); }
.chan input { flex: 1; min-width: 0; height: 24px; border: 0; border-radius: 7px; padding: 0 8px; background: var(--page-field); color: var(--page-ink); font: 600 12.5px/1 var(--ui); }
.page-note { margin: 0; max-width: 340px; font-size: 12px; text-align: center; color: var(--page-soft); }

/* the panel */
.panel { position: relative; flex: none; width: 318px; height: 496px; overflow: hidden; background: #0E0D14; color: var(--ink); font: 500 13px/1.3 var(--ui); -webkit-user-select: none; user-select: none; }
.world { position: absolute; left: 0; top: 0; display: block; touch-action: none; cursor: grab; outline: none; image-rendering: pixelated; }
.world:active { cursor: grabbing; }
.world.aim, .world.aim:active { cursor: crosshair; }
.world.go-cursor { cursor: pointer; }
.world:focus-visible { outline: 3px solid var(--go); outline-offset: -3px; }
.ui { position: absolute; inset: 0; pointer-events: none; }
.ui button, .ui .dock, .ui .card, .ui .sheet, .ui .scrim, .ui .vcard { pointer-events: auto; }

/* icons */
.ic { display: block; flex: none; }
.ic .i1 { fill: currentColor; }
.ic .i2 { fill: #FFFFFF; }
.ic-crown .i1, .gold-ic .i1 { fill: var(--gold-edge); }
.ic-check .i1 { fill: var(--go-edge); }

/* chips and the top bar */
.top { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; border-radius: 999px; background: var(--paper); color: var(--ink); font: 600 13px/1 var(--ui); box-shadow: 0 2px 0 rgba(29, 26, 43, .3); white-space: nowrap; }
.chip b { font-weight: 700; }
.num { font-family: var(--num); font-weight: 400; letter-spacing: .02em; }
.chip .num { font-size: 13px; }
.hud-chip.low .num { color: var(--miss); }
.hud-chip.hit { background: var(--miss); color: #FFFFFF; }
.hud-chip.hit .ic .i1 { fill: #FFFFFF; }
.streak .ic .i1 { fill: var(--soft); }
.streak.hot { background: var(--gold); }
.streak.hot .ic .i1 { fill: var(--ink); }
.streak.hotter { background: #FF8A3D; color: #FFFFFF; }
.streak.hotter .ic .i1 { fill: #FFFFFF; }
.live .ic .i1 { fill: var(--go-edge); }
.ticker-chip { max-width: 100%; opacity: .96; }
.ticker-chip:empty { display: none; }
.ticker-chip b { max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
.ticker-chip.in { animation: tick-in .35s ease-out both; }
@keyframes tick-in { from { transform: translateY(-6px); opacity: 0; } }
.sub-h { margin: -6px 0 0; font-size: 13px; font-weight: 600; color: var(--soft); }
.darts { gap: 1px; padding: 0 9px; }
.darts .ic { color: var(--ink); }
.darts .ic.off { opacity: .2; }
.gold-ic { opacity: .28; }
.got-gold .gold-ic { opacity: 1; }
.logo { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px 0 9px; border-radius: 999px; background: var(--paper); font: 700 16px/1 var(--ui); box-shadow: 0 2px 0 rgba(29, 26, 43, .3); }
.logo-cham .i1 { fill: var(--go-edge); }
.callouts { position: absolute; top: 46px; left: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
.big-chip { height: 30px; font-size: 14px; }
.big-chip .ic .i1 { fill: var(--go-edge); }
.gold-chip { background: var(--gold); }
.gold-chip .ic .i1 { fill: var(--ink); }
.you-chip { background: var(--ink); color: #FFFFFF; }
.you-chip .ic .i1 { fill: #FFFFFF; }
.you-chip .ic .i2 { fill: var(--ink); }

/* buttons: rounded, chunky, with a hard edge you press down into */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 44px; padding: 0 18px; border: 0; border-radius: 14px; background: var(--go); color: var(--go-ink); font: 700 16px/1 var(--ui); cursor: pointer; box-shadow: 0 4px 0 var(--go-edge); transition: transform .08s ease, box-shadow .08s ease; }
.btn:hover { transform: translateY(-1px); box-shadow: 0 5px 0 var(--go-edge); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--go-edge); }
.btn.alt { background: var(--mist); color: var(--ink); box-shadow: 0 4px 0 var(--edge); }
.btn.alt:hover { box-shadow: 0 5px 0 var(--edge); }
.btn.alt:active { box-shadow: 0 1px 0 var(--edge); }
.btn.alt.on { background: var(--ink); color: #FFFFFF; }
.btn.big { width: 100%; height: 56px; border-radius: 16px; font-size: 22px; }
.btn.wide { width: 100%; }
.btn.round { width: 44px; padding: 0; }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.btn:focus-visible, .task:focus-visible, .pose:focus-visible, .slot:focus-visible, .tool:focus-visible, .toggle:focus-visible, .tab:focus-visible, .vcard:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

/* the dock at the bottom */
.dock { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 18px; background: var(--paper); box-shadow: 0 3px 0 rgba(29, 26, 43, .35); }
.dock.slim { flex-direction: row; align-items: center; justify-content: space-between; }
.sub { display: flex; align-items: center; justify-content: center; gap: 5px; margin: -2px 0 0; font-size: 12.5px; font-weight: 600; color: var(--soft); }
.sub b { color: var(--ink); }
.tasks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.task { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 2px 7px; border: 0; border-radius: 12px; background: var(--mist); font-size: 12px; font-weight: 700; cursor: pointer; }
.task:hover { background: #E6E1F0; }
.task .ic .i1 { fill: var(--ink); }
.task.done .ic .i1 { fill: var(--go-edge); }
.task.now { box-shadow: inset 0 0 0 2px var(--go); background: var(--go-tint); }
.task em { font: 400 9px/1 var(--num); font-style: normal; color: var(--soft); }
.row { display: flex; align-items: center; gap: 8px; }
.row.between { justify-content: space-between; }
.row.end { justify-content: flex-end; }
.end-dock .row > .btn { flex: 1; }
.kicker { display: flex; align-items: center; gap: 5px; margin: 0; font-size: 12px; font-weight: 600; color: var(--soft); }
.dock h2, .card h2 { margin: 0; font: 700 20px/1.15 var(--ui); text-wrap: balance; }
.dock h2 .num { font-size: 20px; }
.note { margin: 0; font-size: 12.5px; line-height: 1.35; color: #4A4560; }
.bigrow { display: flex; align-items: flex-end; justify-content: center; gap: 22px; }
.bignum { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.bignum b { font-size: 30px; line-height: 1; }
.bignum span { font-size: 12px; font-weight: 600; color: var(--soft); }
.tiers { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }
.tier { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 9px 0 7px; border-radius: 999px; color: #FFFFFF; font: 700 11.5px/1 var(--ui); white-space: nowrap; }
.tier .ic .i1 { fill: #FFFFFF; }
.tier b { font-weight: 700; }
.t-common { background: var(--common); } .t-rare { background: var(--rare); } .t-epic { background: var(--epic); } .t-legendary { background: var(--legendary); } .t-gold { background: var(--gold-edge); }
.vs { display: flex; align-items: center; justify-content: center; gap: 5px; margin: 0; font-size: 13px; font-weight: 600; }
.vs.win { color: var(--go-edge); }
.end-dock { align-items: stretch; text-align: center; }
.end-dock .kicker { justify-content: center; }

/* overlays and cards */
.overlay { position: absolute; inset: 0; pointer-events: none; }
.scrim { position: absolute; inset: 0; background: rgba(20, 18, 32, .5); }
.scrim.soft { background: rgba(20, 18, 32, .35); pointer-events: none; }
.card { position: absolute; left: 16px; right: 16px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; border-radius: 20px; background: var(--paper); box-shadow: 0 4px 0 rgba(0, 0, 0, .35); text-align: center; }
.how { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 100%; }
.how span { display: flex; align-items: center; gap: 6px; padding: 6px 7px; border-radius: 12px; background: var(--mist); font-size: 12px; font-weight: 600; text-align: left; white-space: nowrap; }
.ladder { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
.ladder span { display: inline-flex; align-items: center; gap: 3px; height: 22px; padding: 0 8px; border-radius: 999px; color: #FFFFFF; font: 400 10px/1 var(--num); }
.ladder .ic .i1 { fill: #FFFFFF; }
.intro-card { gap: 10px; }
.demo-anim { position: relative; width: 120px; height: 58px; }
.demo-cham { position: absolute; left: 30px; top: 12px; }
.demo-cham .i1 { fill: var(--go); }
.demo-hand { position: absolute; left: 62px; top: 22px; animation: tap 1.6s ease-in-out infinite; }
.demo-hand .i1 { fill: var(--ink); }
@keyframes tap { 0%, 100% { transform: translate(14px, 12px); } 45% { transform: translate(0, 0); } 55% { transform: translate(0, 2px) scale(.94); } }
.stamp { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; pointer-events: none; }
.stamp span { padding: 10px 24px; border-radius: 20px; background: var(--go); color: var(--go-ink); font: 700 44px/1 var(--ui); box-shadow: 0 6px 0 var(--go-edge); transform: rotate(-6deg); animation: pop .32s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes pop { from { transform: scale(2) rotate(-14deg); opacity: 0; } to { transform: scale(1) rotate(-6deg); opacity: 1; } }

/* zoom buttons */
.zoomer { position: absolute; right: 10px; bottom: 12px; display: flex; flex-direction: column; gap: 10px; }
.zoomer .btn { width: 40px; height: 40px; border-radius: 12px; }
.zoom-slot .zoomer { top: 50px; bottom: auto; }

/* hide */
.pips { display: flex; gap: 4px; margin: 0; padding: 4px; list-style: none; border-radius: 999px; background: var(--paper); box-shadow: 0 2px 0 rgba(29, 26, 43, .3); }
.pips li { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--mist); }
.pips li.on { background: var(--go); }
.pips li.past { background: var(--ink); }
.pips li.past .ic .i1 { fill: #FFFFFF; }
.poses { gap: 8px; }
.pose { flex: 1; display: grid; place-items: center; height: 50px; border: 0; border-radius: 14px; background: var(--mist); box-shadow: 0 3px 0 var(--edge); cursor: pointer; }
.pose .ic .i1 { fill: #FFFFFF; stroke: none; }
.pose .ic .i2 { fill: var(--ink); }
.pose { --sil: #8F88A6; }
.pose .ic .i1 { fill: var(--sil); }
.pose.on { background: var(--go-tint); box-shadow: 0 3px 0 var(--go-edge), inset 0 0 0 2px var(--go); --sil: var(--go-edge); }
.info { display: flex; align-items: center; gap: 6px; min-height: 22px; margin: 0; font-size: 12.5px; font-weight: 600; }
.info .ic .i1 { fill: currentColor; }
.info.bad { color: var(--miss); }
.info.warn { color: var(--warn); }
.info.good { color: var(--go-edge); }
.info span { flex: 1; min-width: 0; }
.layers { display: flex; flex-direction: column; gap: 2px; margin-left: auto; }
.layers i { display: block; width: 18px; height: 4px; border-radius: 2px; background: var(--edge); }
.layers i.on { background: var(--ink); }
.slots { display: flex; gap: 8px; }
.slot { position: relative; flex: 1; height: 44px; padding: 5px; border: 0; border-radius: 12px; background: var(--mist); box-shadow: 0 3px 0 var(--edge); cursor: pointer; }
.slot i { display: block; width: 100%; height: 100%; border-radius: 8px; box-shadow: inset 0 0 0 1px rgba(29, 26, 43, .12); }
.slot.empty i { background: repeating-conic-gradient(#DDD8E8 0 25%, #FFFFFF 0 50%) 0 0 / 8px 8px; }
.slot b { position: absolute; left: 3px; top: 3px; padding: 2px 3px 1px; border-radius: 4px; background: var(--paper); font: 400 8px/1 var(--num); }
.slot.on { box-shadow: 0 3px 0 var(--go-edge), 0 0 0 3px var(--go); }
.slot u { position: absolute; left: 5px; bottom: 3px; height: 3px; max-width: calc(100% - 10px); border-radius: 2px; background: var(--go-edge); }
.slot.bad { box-shadow: 0 3px 0 #B8342B, 0 0 0 3px var(--miss); }
.slot em { position: absolute; right: -5px; top: -5px; display: grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; background: var(--miss); }
.slot em .ic .i1 { fill: #FFFFFF; }
.fit { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--soft); }
.fit > i { display: block; height: 10px; border-radius: 5px; background: var(--mist); overflow: hidden; }
.fit > i > i { display: block; height: 100%; border-radius: 5px; }
.fit .hi { background: var(--go); } .fit .mid { background: var(--gold); } .fit .lo { background: var(--miss); }
.fit b { color: var(--ink); font-size: 13px; min-width: 34px; text-align: right; }
.hint-chip.bad { color: var(--miss); }
.paint-card .col { display: flex; flex-direction: column; gap: 8px; }
.btn.small-btn { height: 30px; font-size: 13px; border-radius: 10px; padding: 0 12px; }
.tool.peek.on { background: var(--go); box-shadow: 0 3px 0 var(--go-edge); }
.tool { display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 12px; background: var(--mist); box-shadow: 0 3px 0 var(--edge); cursor: pointer; }
.tool .ic .i1 { fill: var(--ink); }
.tool.on { background: var(--ink); box-shadow: 0 3px 0 #000000; }
.tool.on .ic .i1 { fill: #FFFFFF; }
.check { display: flex; align-items: center; gap: 12px; }
.gauge { position: relative; flex: none; width: 64px; height: 64px; }
.gauge svg { position: absolute; inset: 0; }
.gauge b { position: absolute; left: 0; right: 0; top: 17px; text-align: center; font-size: 17px; }
.gauge span { position: absolute; left: 0; right: 0; top: 37px; text-align: center; font-size: 10px; font-weight: 600; color: var(--soft); }
.g0 { fill: none; stroke: var(--mist); stroke-width: 7; }
.g1 { fill: none; stroke-width: 7; stroke-linecap: round; }
.g1.hi { stroke: var(--go); } .g1.mid { stroke: var(--gold); } .g1.lo { stroke: var(--miss); }
.facts { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.facts p { display: flex; align-items: center; gap: 6px; margin: 0; font-size: 12.5px; font-weight: 600; }
.facts p > b, .facts p > .tier { margin-left: auto; }
.facts p .ic .i1 { fill: var(--soft); }
.toggle { display: flex; flex-wrap: wrap; align-items: center; gap: 1px 6px; width: 100%; padding: 6px 10px; border: 0; border-radius: 12px; background: var(--mist); box-shadow: 0 3px 0 var(--edge); font-size: 13px; font-weight: 700; text-align: left; cursor: pointer; }
.toggle em { width: 100%; padding-left: 19px; font-size: 11px; font-weight: 500; font-style: normal; color: var(--soft); }
.toggle.on { background: var(--ink); color: #FFFFFF; box-shadow: 0 3px 0 #000000; }
.toggle.on em { color: #CFCADF; }
.toggle.on .ic .i1 { fill: var(--gold); }
.toggle:disabled { cursor: default; }
.lead { display: flex; gap: 6px; }
.hint-chip { position: absolute; top: 44px; left: 8px; max-width: 214px; height: auto; min-height: 28px; padding: 5px 10px; border-radius: 14px; background: var(--paper); color: var(--ink); box-shadow: 0 2px 0 rgba(29, 26, 43, .3); }
.hint-chip.good { color: var(--go-edge); } .hint-chip.bad { color: var(--miss); } .hint-chip.warn { color: var(--warn); }
.hint-chip .layers { margin-left: 4px; }
.hint-chip span { flex: 0 1 auto; }
.hide-dock .poses { flex: 1; }
.hide-dock .pose { height: 44px; }

/* vote */
.vote-cards { position: absolute; top: 48px; left: 8px; right: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.vcard { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 6px 10px; border: 0; border-radius: 16px; background: var(--paper); box-shadow: 0 3px 0 rgba(0, 0, 0, .3); cursor: pointer; }
.vcard:disabled { cursor: default; }
.vcard.mine { box-shadow: 0 3px 0 var(--go-edge), 0 0 0 3px var(--go); }
.thumb { display: block; width: 128px; height: 200px; border-radius: 10px; overflow: hidden; }
.thumb canvas { display: block; }
.vname { font-size: 14px; font-weight: 700; }
.vbtn { display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 14px; border-radius: 10px; background: var(--go); color: var(--go-ink); font-size: 14px; font-weight: 700; box-shadow: 0 3px 0 var(--go-edge); }
.vbtn .ic .i1 { fill: var(--go-ink); }
.bar { display: block; width: 100%; height: 10px; border-radius: 5px; background: var(--mist); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--go); }
.vpct { font-size: 15px; }
.mine-tag { position: absolute; top: 12px; left: 12px; display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px 0 7px; border-radius: 999px; background: var(--go); color: var(--go-ink); font-size: 12px; font-weight: 700; }
.mine-tag .ic .i1 { fill: var(--go-ink); }

/* reveal */
.dots { display: flex; align-items: center; gap: 4px; height: 28px; padding: 0 10px; border-radius: 999px; background: var(--paper); box-shadow: 0 2px 0 rgba(29, 26, 43, .3); }
.dots i { display: block; width: 7px; height: 7px; border-radius: 50%; background: var(--edge); }
.dots i.on { background: var(--ink); }
.reveal-dock { gap: 8px; }
.reveal-dock.at-top { top: 46px; bottom: auto; }
.rz .zoomer { top: 46px; bottom: auto; }
.rz.low .zoomer { top: auto; bottom: 12px; }
.reveal-dock [data-card] { display: flex; flex-direction: column; gap: 6px; }
.reveal-dock .bigrow { justify-content: flex-start; align-items: center; gap: 12px; }
.reveal-dock .bignum { align-items: flex-start; }
.plus { font-size: 16px; color: var(--go-edge); }
.reveal-dock .row .btn { flex: 1; }
.podium { display: flex; flex-direction: column; gap: 4px; width: 100%; margin: 0; padding: 0; list-style: none; }
.podium li { display: grid; grid-template-columns: 20px 1fr auto; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 10px; background: var(--mist); font-size: 13px; font-weight: 600; }
.podium li b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.podium li em { font-style: normal; font-weight: 700; font-variant-numeric: tabular-nums; }
.podium li.you { background: var(--go); }
.podium .num { font-size: 12px; }

/* scores */
.sheet { position: absolute; inset: 8px; display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 18px; background: var(--paper); box-shadow: 0 3px 0 rgba(29, 26, 43, .35); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; }
.sheet-head h2 { display: flex; align-items: center; gap: 8px; margin: 0; font: 700 20px/1 var(--ui); }
.sheet-head h2 .ic .i1 { fill: var(--gold-edge); }
.sheet-head .btn { width: 36px; height: 36px; border-radius: 11px; }
.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--mist); }
.tab { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; border: 0; border-radius: 9px; background: transparent; font-size: 13px; font-weight: 700; cursor: pointer; }
.tab .ic .i1 { fill: var(--ink); }
.tab[aria-selected="true"] { background: var(--paper); box-shadow: 0 2px 0 var(--edge); }
.bwrap { display: flex; flex-direction: column; gap: 6px; min-height: 0; }
.bhead, .board li { display: grid; grid-template-columns: 26px 1fr 42px 60px; align-items: center; gap: 6px; }
.bhead { padding: 0 8px; font-size: 11px; font-weight: 600; color: var(--soft); }
.bhead span:nth-child(n+3) { text-align: right; }
.board { display: flex; flex-direction: column; gap: 3px; margin: 0; padding: 0; list-style: none; }
.board li { padding: 6px 8px; border-radius: 10px; font-size: 13px; font-weight: 600; }
.board li:nth-child(odd) { background: var(--mist); }
.board li.you { background: var(--go); }
.board li.streamer { background: var(--gold); }
.board li.gap { height: 4px; padding: 0; background: none; }
.board .rk { font-size: 11px; }
.board .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.board .cv { display: flex; justify-content: flex-end; font-variant-numeric: tabular-nums; }
.dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; }
.dot.t-common { background: var(--common); } .dot.t-rare { background: var(--rare); } .dot.t-epic { background: var(--epic); } .dot.t-legendary { background: var(--legendary); }
.sheet .note { text-align: left; }

/* mock stream */
.stream { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 20px 16px; background: rgba(12, 10, 20, .84); }
.stream-box { display: flex; flex-direction: column; gap: 10px; width: min(920px, 100%); }
.mock { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0; color: #FFFFFF; font-size: 13px; font-weight: 600; }
.mock b { padding: 2px 8px; border-radius: 6px; background: var(--miss); }
.stream-frame { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 12px; background: #262233; container-type: inline-size; }
.stream-frame::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .03) 0 2cqw, transparent 2cqw 4cqw); }
.stream-pic { position: absolute; left: 4%; top: 6%; height: 88%; width: auto; aspect-ratio: 318 / 496; border-radius: 1cqw; image-rendering: pixelated; }
.ov { position: absolute; left: 39%; right: 26%; top: 6%; display: flex; flex-direction: column; gap: 1.6cqw; }

  },
  planks: (m, s) => (i, j) => { const p = mod(i, 4); return K(m, p === 0 ? 3 : p === 3 ? 1 : hash2(Math.floor(i / 4), Math.floor(j / 7), s) < 0.15 ? 1 : 2); },
  ribbed: (m) => (i) => K(m, [3, 2, 2, 1][mod(i, 4)]),
  soil: (m, s) => (i, j, x, y) => { const h = hash2(x, y, s); return K(m, j % 3 === 2 ? 0 : h < 0.2 ? 1 : h > 0.9 ? 3 : 2); },
  gravel: (m, s) => (i, j, x, y) => { const h = hash2(x, y, s); return K(m, h < 0.16 ? 1 : h > 0.88 ? 3 : 2); },
  felt: (m, s) => (i, j, x, y) => { const row = Math.floor(j / 9), rj = j % 9, h = hash2(x, y, s); if (rj === 0) return K(m, 3); if (rj === 1) return K(m, 1); if (mod(i + row * 23, 61) === 0) return K(m, 1); return K(m, h < 0.05 ? 1 : h > 0.97 ? 3 : vnoise(x / 9, y / 4, s) < 0.3 ? 1 : 2); },
};

/* ---------- building blocks, lit from the top left ---------- */

const EL = {};

// A sky from colour stops [[y, hex], ...], dithered between neighbours.
EL.sky = (g, stops) => {
  g.surf('sky');
  const S = g.S, ms = stops.map(([, hex]) => S.mat(hex, { flat: true }));
  for (let y = -MY; y < H + MY; y++) {
    let k = 0;
    while (k < stops.length - 2 && y >= stops[k + 1][0]) k++;
    const f = clamp((y - stops[k][0]) / (stops[k + 1][0] - stops[k][0]), 0, 1);
    for (let x = -MX; x < W + MX; x++) g.px(x, y, f > dither(x, y) ? ms[k + 1] : ms[k]);
  }
};
EL.sun = (g, cx, cy, r, core, rim, glow) => {
  g.surf('sky');
  const S = g.S, mg = S.mat(glow, { flat: true }), mr = S.mat(rim, { flat: true }), mc = S.mat(core, { flat: true });
  g.oval(cx, cy, r + 8, r + 8, (dx, dy, x, y, d) => { const rr = Math.sqrt(d) * (r + 8); return rr > r && dither(x, y) > 0.3 + 0.7 * (rr - r) / 8 ? K(mg) : -1; });
  g.oval(cx, cy, r, r, (dx, dy, x, y, d) => K(d > 0.72 ? mr : mc));
};
// A ridge line with a fill function below it.
EL.ridge = (g, x0, x1, yAt, fn, yBottom, surf) => {
  g.surf(surf);
  for (let x = x0; x <= x1; x++) { const top = Math.round(yAt(x)); for (let y = top; y < yBottom; y++) g.put(x, y, fn(x, y, y - top)); }
};
// Patchwork fields with hedgerows, for far hills.
EL.fields = (g, x0, x1, yAt, yBottom, mats, hedge, s) => {
  EL.ridge(g, x0, x1, yAt, (x, y, d) => {
    if (d === 0) return K(hedge, 3);
    const sk = hash2(Math.floor(y / 9), 1, s) * 20.8, u = x + y * 0.55 + sk;
    if (mod(u, 26) < 1.2 || mod(d, 9) < 1) return K(hedge, hash2(x, y, s) < 0.3 ? 1 : 2);
    const m = mats[Math.floor(hash2(Math.floor(u / 26), Math.floor(d / 9), s) * mats.length)];
    return K(m, hash2(x, y, s + 3) < 0.06 ? 3 : 2);
  }, yBottom, 'far hills');
};

EL.wall = (g, x, y, w, h, fn) => {
  g.fill(x, y, w, h, fn);
  g.shadeRect(x, y, 1, h, 1);
  g.shadeRect(x + w - 1, y, 1, h, -1);
};

// A window with a recess, glazing bars, a reflection, a sill and sometimes curtains or a light on.
EL.window = (g, x, y, w, h, o) => {
  const f = o.frame, gl = o.lit ? o.lit : o.glass;
  g.surf('window');
  g.rect(x, y, w, h, f, 2);
  g.hline(x, x + w - 1, y, K(f, 3)); g.vline(x, y, y + h - 1, K(f, 3));
  g.vline(x + w - 1, y, y + h - 1, K(f, 1));
  for (let j = 1; j < h - 1; j++) for (let i = 1; i < w - 1; i++) {
    let t;
    if (o.lit) t = j < 2 ? 3 : 2;
    else if (j === 1) t = 0;
    else if (i + j === 3) t = 4;
    else if (i + j === 4) t = 3;
    else if (j >= h - 3) t = 0;
    else t = 1;
    g.px(x + i, y + j, gl, t);
  }
  if (o.lit && o.shape) g.px(x + 1 + ((w - 2) >> 1), y + h - 3, gl, 0);
  if (h >= 8 && w >= 5) g.hline(x + 1, x + w - 2, y + Math.floor(h / 2), K(f, 2));
  if (w >= 7) g.vline(x + Math.floor(w / 2), y + 1, y + h - 2, K(f, 2));
  if (o.curtain) { g.surf('curtain'); g.vline(x + 1, y + 1, y + h - 2, K(o.curtain, 3)); g.vline(x + w - 2, y + 1, y + h - 2, K(o.curtain, 1)); }
  if (o.sill) { g.surf('window sill'); g.hline(x - 1, x + w, y + h, K(o.sill, 4)); g.shadeRect(x - 1, y + h + 1, w + 2, 1, -1); }
  if (o.lintel) { g.surf('lintel'); g.hline(x - 1, x + w, y - 1, K(o.lintel, 3)); }
  if (o.shutter) {
    g.surf('shutter');
    for (let j = 0; j < h; j++) {
      g.px(x - 3, y + j, o.shutter, j % 2 ? 1 : 3); g.px(x - 2, y + j, o.shutter, j % 2 ? 1 : 2);
      g.px(x + w, y + j, o.shutter, j % 2 ? 0 : 2); g.px(x + w + 1, y + j, o.shutter, j % 2 ? 0 : 1);
    }
  }
  if (o.box) {
    g.surf('window box');
    g.rect(x - 1, y + h + 1, w + 2, 2, o.box, 1); g.hline(x - 1, x + w, y + h + 1, K(o.box, 2));
    for (let i = -1; i <= w; i++) {
      const hh = hash2(x + i, y, 5);
      g.px(x + i, y + h, hh < 0.5 ? o.flowers[Math.floor(hh * 2 * o.flowers.length) % o.flowers.length] : o.leaf, hh < 0.5 ? 3 : 2);
      if (hh > 0.72) g.px(x + i, y + h - 1, o.leaf, 3);
    }
  }
  if (o.lit) g.S.fx.lights.push({ li: g.li, x: x + 1, y: y + 1, w: w - 2, h: h - 2, off: g.S.mats[o.glass][1] });
};

EL.door = (g, x, y, w, h, o) => {
  g.surf('door');
  g.rect(x - 1, y - 1, w + 2, h + 1, o.frame, 2);
  g.vline(x - 1, y - 1, y + h - 1, K(o.frame, 3)); g.vline(x + w, y - 1, y + h - 1, K(o.frame, 1));
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    let t = i === 0 ? 3 : i === w - 1 ? 1 : 2;
    const pj = j - 2;
    if (w >= 5 && pj > 0 && pj < h - 3 && (i === 1 || i === w - 2) && pj % 6 !== 0) t = 1;
    if (w >= 5 && pj > 0 && pj % 6 === 0 && i > 0 && i < w - 1) t = 1;
    g.px(x + i, y + j, o.col, t);
  }
  if (o.fan) { g.surf('fanlight'); g.hline(x, x + w - 1, y, K(o.glass, 3)); g.hline(x + 1, x + w - 2, y + 1, K(o.glass, 1)); }
  g.px(x + w - 2, y + Math.floor(h * 0.55), o.knob, 4);
  if (o.step !== undefined) { g.surf('step'); g.hline(x - 2, x + w + 1, y + h, K(o.step, 4)); g.hline(x - 2, x + w + 1, y + h + 1, K(o.step, 1)); }
};

EL.awning = (g, x, y, w, h, a, b) => {
  g.surf('awning');
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) g.px(x + i, y + j, Math.floor(i / 3) % 2 ? b : a, j === 0 ? 3 : j === h - 1 ? 1 : 2);
  for (let i = 0; i < w; i++) if (i % 3 !== 1) g.px(x + i, y + h, Math.floor(i / 3) % 2 ? b : a, 1);
  g.shadeRect(x, y + h + 1, w, 1, -2); g.shadeRect(x, y + h + 2, w, 2, -1);
};

EL.sign = (g, x, y, w, h, bg, fg, txt, trim) => {
  g.surf('sign');
  g.rect(x, y, w, h, bg, 2);
  g.hline(x, x + w - 1, y, K(trim === undefined ? bg : trim, 3)); g.hline(x, x + w - 1, y + h - 1, K(trim === undefined ? bg : trim, 1));
  g.text(txt, x + Math.floor((w - textWidth(txt)) / 2), y + Math.floor((h - 5) / 2), K(fg, 3), K(bg, 0));
  g.shadeRect(x, y + h, w, 1, -1);
};

EL.roof = (g, x, top, w, h, m, kind, s) => {
  g.surf(kind === 'slate' ? 'slate roof' : 'roof tiles');
  const pat = kind === 'slate' ? TX.slate(m, s) : TX.tiles(m, s);
  for (let j = 0; j < h; j++) {
    const inset = Math.floor((h - 1 - j) * 0.9);
    for (let i = inset; i < w - inset; i++) g.put(x + i, top + j, i === inset ? K(m, 3) : i === w - 1 - inset ? K(m, 0) : pat(i, j, x + i, top + j));
  }
  const ri = Math.floor((h - 1) * 0.9);
  g.hline(x + ri, x + w - 1 - ri, top, K(m, 4));
  g.hline(x, x + w - 1, top + h - 1, K(m, 0));
};
EL.gable = (g, x, top, w, h, wallFn, trim) => {
  g.surf('gable');
  const mid = (w - 1) / 2;
  for (let j = 0; j < h; j++) {
    const half = (j + 1) / h * (w / 2 + 1);
    for (let i = Math.floor(mid - half); i <= Math.ceil(mid + half); i++) {
      const e = Math.abs(i - mid) > half - 1.6;
      g.put(x + i, top + j, e ? K(trim, i < mid ? 4 : 2) : wallFn(i, j, x + i, top + j));
    }
  }
  g.oval(x + mid + 0.5, top + h * 0.62, 1.6, 1.6, K(trim, 1));
};
EL.chimney = (g, x, y, w, h, m, mo, pot) => {
  g.surf('chimney');
  EL.wall(g, x, y, w, h, TX.brick(m, mo, x));
  g.rect(x - 1, y, w + 2, 2, mo, 3); g.hline(x - 1, x + w, y, K(mo, 4));
  if (pot !== undefined) for (const px of w >= 6 ? [x + 1, x + w - 3] : [x + 1]) {
    g.surf('chimney pot');
    g.rect(px, y - 3, 2, 3, pot, 2); g.px(px, y - 3, pot, 4); g.px(px, y - 2, pot, 3); g.px(px + 1, y - 1, pot, 1);
    g.S.fx.smoke.push({ li: g.li, x: px + 1, y: y - 4 });
  }
};

// Leaves lit from the top left, in overlapping clumps.
EL.foliage = (g, cx, cy, rx, ry, m, s, o) => {
  o = o || {};
  const r = rng('leaves', cx, cy, s), blobs = [[cx, cy, rx, ry]];
  const n = o.blobs || 3 + Math.floor(rx / 5);
  for (let k = 0; k < n; k++) { const a = r() * Math.PI * 2, d = 0.5 + r() * 0.35; blobs.push([cx + Math.cos(a) * rx * d, cy + Math.sin(a) * ry * d * 0.9, rx * (0.35 + r() * 0.2), ry * (0.35 + r() * 0.2)]); }
  for (const [bx, by, brx, bry] of blobs) {
    g.oval(bx, by, brx, bry, (dx, dy, x, y, d) => {
      const nx = (x - cx) / rx, ny = (y - cy) / ry;
      const light = -(dx * 0.55 + dy * 0.7) * 0.5 - (nx * 0.55 + ny * 0.8) * 0.55 + (vnoise(x / 2.6, y / 2.6, s) - 0.5) * 0.9;
      if (d > 0.8 && hash2(x, y, s) < 0.35) return -1;
      return K(m, light > 0.62 ? 4 : light > 0.25 ? 3 : light > -0.15 ? 2 : light > -0.5 ? 1 : 0);
    });
  }
  if (o.fruit) for (let k = 0; k < o.fruit.n; k++) { const a = r() * 6.28, d = r() * 0.8; g.px(cx + Math.cos(a) * rx * d, cy + Math.sin(a) * ry * d, o.fruit.m, 3); }
};
EL.tree = (g, cx, base, rx, ry, trunkH, leaf, trunk, s, o) => {
  o = o || {};
  if (o.shadow !== false) g.shadeOval(cx + 3, base, rx * 0.9, 2.5, -1);
  g.surf('tree');
  const tx = Math.round(cx - 2), ty = base - trunkH;
  for (let j = 0; j < trunkH; j++) for (let i = 0; i < 4; i++) g.px(tx + i, ty + j, trunk, i === 0 ? 3 : i === 3 ? 0 : hash2(i, j, s) < 0.2 ? 1 : 2);
  g.line(tx + 1, ty + 6, tx - 4, ty - 2, K(trunk, 2)); g.line(tx + 3, ty + 4, tx + 8, ty - 3, K(trunk, 1));
  EL.foliage(g, cx, ty - ry * 0.55, rx, ry, leaf, s, o);
};
EL.bush = (g, x, y, w, h, leaf, s, o) => { g.shadeOval(x + w / 2 + 2, y + h, w / 2, 2, -1); g.surf('bush'); EL.foliage(g, x + w / 2, y + h / 2, w / 2, h / 2, leaf, s, Object.assign({ blobs: 3 }, o || {})); };
EL.lamp = (g, x, base, h, m, glass) => {
  g.surf('lamp post');
  g.rect(x - 1, base - 3, 3, 3, m, 2); g.px(x - 1, base - 3, m, 3);
  for (let y = base - h; y < base - 3; y++) { g.px(x, y, m, 2); g.px(x + 1, y, m, 0); }
  g.hline(x - 2, x + 3, base - h + 6, K(m, 2));
  g.rect(x - 2, base - h - 5, 6, 1, m, 3);
  for (let j = 0; j < 4; j++) for (let i = 0; i < 4; i++) g.px(x - 1 + i, base - h - 4 + j, glass, i === 0 ? 4 : j === 3 ? 2 : 3);
  g.px(x, base - h - 6, m, 2); g.px(x + 1, base - h - 6, m, 0);
};
EL.railing = (g, x0, x1, y, h, m) => {
  g.surf('railing');
  g.hline(x0, x1, y, K(m, 3)); g.hline(x0, x1, y + 3, K(m, 2));
  for (let x = x0; x <= x1; x += 3) g.vline(x, y, y + h - 1, K(m, 1));
};
EL.bunting = (g, x0, y0, x1, y1, sag, line, flags) => {
  g.surf('bunting');
  const n = Math.abs(x1 - x0);
  for (let k = 0; k <= n; k++) {
    const t = k / n, x = Math.round(x0 + (x1 - x0) * t), y = Math.round(y0 + (y1 - y0) * t + sag * 4 * t * (1 - t));
    g.px(x, y, line, 1);
    if (k % 7 === 3) {
      const m = flags[Math.floor(k / 7) % flags.length];
      for (let j = 1; j <= 5; j++) for (let i = 0; i <= 5 - j; i++) g.px(x - 2 + Math.ceil(j / 2) + i, y + j, m, i === 0 ? 3 : j > 3 ? 1 : 2);
    }
  }
};
EL.washing = (g, x0, y0, x1, sag, line, clothes, peg) => {
  g.surf('washing line');
  const n = x1 - x0, yAt = t => y0 + sag * 4 * t * (1 - t);
  for (let k = 0; k <= n; k++) g.px(x0 + k, yAt(k / n), line, 2);
  g.surf('washing');
  let x = x0 + 4, k = 0;
  while (x < x1 - 8) {
    const m = clothes[k % clothes.length], y = Math.round(yAt((x - x0) / n)) + 1, kind = k % 3;
    if (kind === 0) { for (let j = 0; j < 8; j++) for (let i = 0; i < 7; i++) { if (j >= 2 && (i === 0 || i === 6)) continue; g.px(x + i, y + j, m, i === 1 || j === 0 ? 3 : i === 5 ? 1 : 2); } }
    else if (kind === 1) { for (let j = 0; j < 8; j++) for (let i = 0; i < 6; i++) g.px(x + i, y + j, j === 5 ? clothes[(k + 1) % clothes.length] : m, i === 0 ? 3 : i === 5 ? 1 : 2); }
    else { for (const sx of [0, 4]) { g.rect(x + sx, y, 2, 5, m, 2); g.px(x + sx, y, m, 3); g.rect(x + sx - 1, y + 4, 2, 1, m, 1); } }
    if (peg !== undefined) g.px(x + 1, y - 1, peg, 3);
    x += kind === 2 ? 9 : 10; k++;
  }
};
EL.crate = (g, x, y, w, h, m) => {
  g.shadeRect(x + 1, y + h, w, 1, -1);
  g.surf('crate');
  g.fill(x, y, w, h, (i, j) => K(m, i === 0 || j === 0 ? 3 : i === w - 1 || j === h - 1 ? 0 : j % 3 === 2 ? 1 : 2));
};
EL.barrel = (g, x, y, w, h, m, hoop) => {
  g.shadeRect(x + 1, y + h, w, 1, -1);
  g.surf('barrel');
  g.fill(x, y, w, h, (i, j) => {
    if ((i === 0 || i === w - 1) && (j === 0 || j === h - 1)) return -1;
    if (j === 1 || j === h - 2) return K(hoop, i < 2 ? 3 : 1);
    return K(m, i === 0 ? 3 : i === w - 1 ? 0 : i === 1 ? 3 : i % 3 === 2 ? 1 : 2);
  });
};
EL.bench = (g, x, y, w, m, leg) => {
  g.shadeRect(x + 1, y + 8, w, 1, -1);
  g.surf('bench');
  g.hline(x, x + w - 1, y, K(m, 3)); g.hline(x, x + w - 1, y + 1, K(m, 1));
  g.hline(x, x + w - 1, y + 3, K(m, 3)); g.hline(x, x + w - 1, y + 4, K(m, 1));
  g.hline(x - 1, x + w, y + 5, K(m, 2));
  for (const lx of [x + 1, x + w - 2]) g.vline(lx, y, y + 7, K(leg, 1));
};
EL.bollard = (g, x, y, m) => {
  g.shadeRect(x + 1, y + 6, 4, 1, -1);
  g.surf('bollard');
  g.rect(x, y, 4, 6, m, 2); g.vline(x, y, y + 5, K(m, 3)); g.vline(x + 3, y, y + 5, K(m, 0));
  g.rect(x - 1, y, 6, 2, m, 2); g.hline(x - 1, x + 4, y, K(m, 4));
};
EL.pot = (g, x, y, pot, leaf, flower) => {
  g.shadeRect(x + 1, y + 8, 6, 1, -1);
  g.surf('flower pot');
  g.fill(x, y + 4, 6, 4, (i, j) => K(pot, j === 0 ? 4 : i === 0 ? 3 : i === 5 ? 0 : 2));
  g.oval(x + 3, y + 2.5, 4, 3, (dx, dy, px, py) => (hash2(px, py, 4) < 0.28 ? K(flower, dy < 0 ? 4 : 3) : K(leaf, dy < -0.2 ? 3 : dy > 0.4 ? 1 : 2)));
};
EL.planter = (g, x, y, w, box, leaf, flowers) => {
  g.surf('planter');
  g.fill(x, y + 4, w, 6, (i, j) => K(box, j === 0 ? 4 : i === 0 ? 3 : i === w - 1 ? 0 : j === 5 ? 1 : 2));
  g.fill(x, y, w, 4, (i, j, px, py) => (hash2(px, py, 3) < 0.3 ? K(flowers[Math.floor(hash2(px, py, 4) * flowers.length)], j < 2 ? 4 : 3) : K(leaf, j === 0 ? 3 : hash2(px, py, 5) < 0.3 ? 1 : 2)));
};
EL.water = (g, y0, y1, m, s) => {
  g.surf('water');
  for (let y = y0; y < y1; y++) for (let x = -MX; x < W + MX; x++) {
    const d = (y - y0) / (y1 - y0), h = hash2(Math.floor(x / 6), y, s), r = hash2(Math.floor((x + (y & 1) * 3) / 4), y, s + 1);
    let t = d < 0.08 ? 3 : d < 0.4 ? 2 : 1;
    if (h > 0.9) t = Math.min(4, t + 2); else if (r < 0.12) t = Math.max(0, t - 1);
    g.px(x, y, m, t);
  }
  g.S.fx.water.push({ li: g.li, y0: y0 + 2, y1, m });
};
// Mirror what is just above the waterline into the water, darker and broken by ripples.
EL.reflect = (g, x0, x1, waterY, depth) => {
  for (let j = 1; j <= depth; j++) {
    if (j % 3 === 0) continue;
    const off = (j % 2 ? 1 : -1) * (j > 3 ? 1 : 0);
    for (let x = x0; x <= x1; x++) {
      const c = g.get(x + off, waterY - j);
      if (c < 8) continue;
      g.put(x, waterY + j - 1, (c & ~7) | Math.max(0, (c & 7) - 2));
    }
  }
};
EL.boat = (g, x, y, w, o) => {
  g.surf('boat');
  const h = 7;
  for (let j = 0; j < h; j++) {
    const inset = Math.max(0, j - 2), inR = Math.max(0, j - 1);
    for (let i = inset; i < w - inR; i++) {
      let t = j === 0 ? 4 : j === 1 ? 3 : j >= h - 2 ? 0 : 2;
      if (i === inset && j > 1) t = 3;
      g.px(x + i, y + j, j === 1 ? o.stripe : o.hull, t);
    }
  }
  if (o.cabin !== undefined) {
    const cw = Math.max(7, Math.floor(w * 0.34)), cx = x + Math.floor(w * (o.cabinAt || 0.45));
    g.surf('wheelhouse');
    for (let j = 0; j < 7; j++) for (let i = 0; i < cw; i++) g.px(cx + i, y - 7 + j, o.cabin, i === 0 ? 3 : i === cw - 1 ? 1 : 2);
    g.hline(cx - 1, cx + cw, y - 8, K(o.roof, 3)); g.hline(cx - 1, cx + cw, y - 7, K(o.roof, 1));
    for (let i = 1; i < cw - 1; i += 3) { g.px(cx + i, y - 5, o.glass, 1); g.px(cx + i + 1, y - 5, o.glass, 3); g.px(cx + i, y - 4, o.glass, 0); g.px(cx + i + 1, y - 4, o.glass, 1); }
  }
  if (o.mast !== undefined) {
    const mx = x + Math.floor(w * 0.28);

  g.surf(o.tex === 'brick' ? 'brick wall' : o.tex === 'board' ? 'wooden wall' : o.tex === 'stone' ? 'stone wall' : 'painted wall');
  EL.wall(g, x, top, w, h, tex);
  if (o.quoins !== undefined) for (let y = top + 2; y < base - 1; y += 4) { g.rect(x, y, 2, 2, o.quoins, 3); g.rect(x + w - 2, y + 1, 2, 2, o.quoins, 1); }
  const rh = o.roofH || 0;
  if (o.roof === 'pitched') EL.roof(g, x - 2, top - rh, w + 4, rh, o.roofM, o.slate ? 'slate' : 'tiles', s);
  else if (o.roof === 'gable') EL.gable(g, x, top - rh, w, rh, tex, o.trim);
  else if (o.roof === 'flat') { g.surf('parapet'); g.rect(x - 1, top - 3, w + 2, 3, o.parapet, 2); g.hline(x - 1, x + w, top - 3, K(o.parapet, 4)); g.hline(x - 1, x + w, top - 1, K(o.parapet, 0)); }
  if (o.chimney) EL.chimney(g, x + (o.chimneyLeft ? 3 : w - 9), top - rh - 5, 6, rh + 6 - (o.roof === 'gable' ? Math.floor(rh * 0.6) : 0), o.chimM, o.mortar, o.pot);
  g.shadeRect(x, top, w, o.roof === 'flat' ? 1 : 2, -1);
  let floorTop = base;
  const dw = o.doorW || 6;

    const dx = x + (o.doorLeft ? 3 : w - dw - 3), wx0 = o.doorLeft ? dx + dw + 3 : x + 3, wx1 = o.doorLeft ? x + w - 3 : dx - 3;
    g.surf('shop window');

    for (let j = 0; j < wh; j++) for (let i = 0; i < ww; i++) {
      let c;

      else if (j === wh - 5) c = K(sp.front, 1);

    EL.sign(g, x + 2, floorTop - 8, w - 4, 7, sp.sign[0], sp.sign[1], sp.name, sp.sign[2]);

    floorTop -= 9;
  } else if (o.door !== false) {

  }

// Cobbles laid in arcs, like a fan.
TX.fan = (m, gap, cx, cy, s) => (i, j, x, y) => {
  const dx = x - cx, dy = (y - cy) * 1.8, d = Math.hypot(dx, dy), ring = Math.floor(d / 4), rj = d - ring * 4;
  if (rj < 0.85) return K(gap, 1);
  const a = Math.atan2(dy, dx) * d / 5, seg = Math.floor(a), sf = a - seg;
  if (sf < 0.18) return K(gap, 1);
  const h = hash2(ring, seg, s);
  let t = h < 0.25 ? 1 : h > 0.85 ? 3 : 2;
  if (rj > 3.2) t = Math.max(0, t - 1); else if (rj < 1.8 && sf < 0.5) t = Math.min(4, t + 1);
  return K(m, t);
};

/* ---------- which picture, which day ---------- */

// Everyone hides in sceneFor(d) on day d. It gets hunted on day d + 1.

const MEMO = { scene: {}, opts: {}, vote: {}, crowd: {}, hunters: {} };

function crowd(d) {

// Your own hide from day d, and how tomorrow's hunters did against it.

/* ---------- hunters ---------- */

// Turn a grid into crisp SVG. 'o' is a hole drawn in the second colour. Outline icons get a white fill inside.
function icon(name, scale, cls) {
  const g = ICONS[name], h = g.length, w = Math.max(...g.map(r => r.length));
  scale = scale || 2;
  let d = '', d2 = '';
  const inside = name === 'hand' ? floodInside(g, w, h) : null;
  g.forEach((row, y) => row.split('').forEach((ch, x) => {
    if (ch === '#') d += `M${x} ${y}h1v1h-1z`;
    else if (ch === 'o' || (inside && inside[y * w + x])) d2 += `M${x} ${y}h1v1h-1z`;
  }));
  return `<svg class="ic ic-${name} ${cls || ''}" viewBox="0 0 ${w} ${h}" width="${w * scale}" height="${h * scale}" shape-rendering="crispEdges" aria-hidden="true"><path class="i1" d="${d}"/>${d2 ? `<path class="i2" d="${d2}"/>` : ''}</svg>`;
}
function floodInside(g, w, h) {
  const out = new Uint8Array(w * h), seen = new Uint8Array(w * h), q = [];
  for (let x = 0; x < w; x++) q.push([x, 0], [x, h - 1]);
  for (let y = 0; y < h; y++) q.push([0, y], [w - 1, y]);
  while (q.length) {
    const [x, y] = q.pop();
    if (x < 0 || y < 0 || x >= w || y >= h || seen[y * w + x] || (g[y][x] === '#')) continue;
    seen[y * w + x] = 1;
    q.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
  }
  for (let k = 0; k < w * h; k++) out[k] = !seen[k] && g[Math.floor(k / w)][k % w] !== '#' ? 1 : 0;
  return out;
}

        if (h.you) drawTag(wctx, 'You', b.x + b.w / 2, b.y, '#FFFFFF', '#1D1A2B');
        else if (WST.cam.z >= 2 || t - h.pop < 1600) drawTag(wctx, h.streamer ? channel() : h.name, b.x + b.w / 2, b.y, h.streamer ? GOLD_TIER.col : TIER_BY[h.tier].col, '#FFFFFF');
      }
      for (let k = pops.length - 1; k >= 0; k--) {
        const p = pops[k], a = (t - p.t) / 1100;
        if (a >= 1) { pops.splice(k, 1); continue; }
        let x = p.sx, y = p.sy;
        if (p.h) { const b = hideBox(p.h, WST.cam); x = b.x + b.w / 2; y = b.y - 32; }
        if (a < 0) continue;
        drawPop(wctx, p.text, x, y - a * 18, p.col, 1 - Math.max(0, a - 0.6) / 0.4, p.big);
      }
      if (WST.cam.z > 1.05) drawMinimap(wctx, S, WST.cam, 10, H - 10 - Math.round(56 * H / W), 56);
    },
    key(e, down) {
      if (zoomKeys(e, down)) return true;
      if (down && (e.key === 'Enter' || e.key === ' ') && phase === 'play' && document.activeElement === world) { throwAt(WST.mx === undefined ? W / 2 : WST.mx, WST.my === undefined ? H / 2 : WST.my); return true; }
      return false;
    },
    test: {
      start,
      state: () => ({ phase, pts, streak, left: Math.round(left * 10) / 10, z: WST.cam.z, found: hides.filter(h => h.found).length }),
      end: () => { if (phase === 'play') { penalty = HUNT_SECONDS; } },
      // point at an unfound chameleon: zoom in on it and return where to click
      aim(i, zoom) {
        const list = hides.filter(h => !h.found && !h.you && !h.streamer), r = world.getBoundingClientRect();
        for (let n = 0; n < list.length; n++) {
          const h = list[(i || 0) + n] || list[n], P = POSES[h.pose], z = zoom || 3;
          const [cx, cy] = aimAt(h, z);
          camLook(WST.cam, cx, cy, z);
          const ok = [];
          for (const k of P.cells) {
            const [ox, oy] = layerShift(h.layer, WST.cam.cx, WST.cam.cy);
            const [sx, sy] = camToScreen(WST.cam, h.x + ox + (k % P.w) + 0.5, h.y + oy + Math.floor(k / P.w) + 0.5);
            if (sx < 2 || sy < 40 || sx > W - 60 || sy > H - 2) continue;
            const hit = hitTest(S, WST.cam, hides.filter(x => !x.found), sx, sy);
            if (hit && hit.hide === h) ok.push({ x: r.left + sx, y: r.top + sy });
          }
          if (ok.length) return Object.assign(ok[ok.length >> 1], { name: h.name, tier: h.tier });
        }
        return null;
      },
    },
  };
};

// Floating "+400 Epic" text.
function drawPop(ctx, text, x, y, col, alpha, big) {
  ctx.save(); ctx.scale(DPR, DPR); ctx.globalAlpha = clamp(alpha, 0, 1);
  ctx.font = `700 ${big ? 20 : 13}px Fredoka, "Arial Rounded MT Bold", Arial, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 4; ctx.strokeStyle = '#FFFFFF'; ctx.lineJoin = 'round';
  ctx.strokeText(text, clamp(x, 40, W - 40), Math.max(14, y));
  ctx.fillStyle = col; ctx.fillText(text, clamp(x, 40, W - 40), Math.max(14, y));
  ctx.restore();
}

/* ---------- hide: pick a spot, pick four colours, paint, check ---------- */

const STEP_ICONS = [['place', 'pin', 'Pick a spot'], ['colours', 'dropper', 'Pick 4 colours'], ['paint', 'brush', 'Paint yourself'], ['check', 'eye', 'Check']];

SCREENS.hide = () => {
  const d = ST.day, S = getScene(sceneFor(d), d), saved = ST.hides[d];
  let step = saved ? 'done' : 'place';
  let pose = 'perch', you = null, ghost = null, slot = 0, brush = 1, painting = false, tEnd = 0, whistle = false, score = null;
  let peek = false, where = false, lastSec = -1, stroke = null, checkT0 = 0, infoKey = '', fit = null, liveQ = null, liveT = 0;
  const cols = [null, null, null, null];
  if (saved) { you = userHide(d); whistle = !!saved.whistle; score = { q: saved.q, v: saved.v }; }
  const eye = newCanvas(Math.round(W * DPR), Math.round(H * DPR)), eyeCam = makeCam();

  ui.innerHTML = `
    <div class="top hud">
      <div class="lead" data-lead></div>
      <ol class="pips" data-pips aria-label="Steps"></ol>
    </div>
    <p class="info hint-chip" data-info></p>
    <div class="zoom-slot" data-zoomslot></div>
    <div class="overlay" data-over></div>
    <div class="dock hide-dock" data-dock></div>`;
  const dock = $('[data-dock]', ui), over = $('[data-over]', ui);

  /* --- spot --- */
  function assess(h) {
    const si = stickInfo(S, h), P = POSES[h.pose];
    const out = new Int16Array(P.w * P.h), cover = new Uint8Array(P.w * P.h);
    sampleBehind(S, h, W / 2, H / 2, out, cover);
    let cov = 0;
    for (const k of P.cells) cov += cover[k];
    const covered = cov / P.cells.length;
    return { ok: si.stick >= 0.85 && inPicture(h), stick: si.stick, surface: si.surface, covered };
  }
  function ghostAt(sx, sy) {
    const [px, py] = camToScene(WST.cam, sx, sy), pk = pickScene(S, px, py, WST.cam.cx, WST.cam.cy);
    if (!pk) return null;
    const P = POSES[pose], [ox, oy] = layerShift(pk.li, WST.cam.cx, WST.cam.cy);
    const h = { id: 'ghost', layer: pk.li, pose, ver: 1, x: clamp(Math.round(px - ox - P.w / 2), 0, W - P.w), y: clamp(Math.round(py - oy - P.h / 2), 0, H - P.h) };
    h.info = pk.surf === 'sky' ? { ok: false, stick: 0, covered: 0, sky: true } : assess(h);
    return h;
  }
  function place(sx, sy) {
    const g = ghostAt(sx, sy);
    if (!g || !g.info.ok) { ghost = g; spotInfo(true); return; }
    you = { id: 'you', name: 'You', you: true, layer: g.layer, x: g.x, y: g.y, pose, cells: blankCells(pose), ver: 1, info: g.info };
    ghost = null;
    renderDock();
  }
  function setPose(p) {
    pose = p;
    if (you) {
      const O = POSES[you.pose], P = POSES[p];
      const h = { id: 'you', name: 'You', you: true, layer: you.layer, pose: p, cells: blankCells(p), ver: 1,
        x: clamp(Math.round(you.x + O.w / 2 - P.w / 2), 0, W - P.w), y: clamp(Math.round(you.y + O.h / 2 - P.h / 2), 0, H - P.h) };
      h.info = assess(h);
      you = h;
    }
    renderDock();
  }
  function spotInfo(force) {
    const h = force || (!you && ghost && WST.over) ? ghost : you, inf = h && h.info;
    let ic = 'hand', txt = TOUCHY ? 'Tap where you want to hide' : 'Click where you want to hide', cls = '';
    if (inf) {
      if (!inf.ok) { ic = 'x'; txt = inf.sky ? "You can't hide in the sky" : 'Nothing to stick to'; cls = 'bad'; }
      else if (inf.stick < 0.97) { ic = 'eye'; txt = "You'll slide off the edge"; cls = 'warn'; }
      else if (inf.covered > 0.3) { ic = 'eye'; txt = 'Partly covered, so fewer points'; cls = 'warn'; }
      else { ic = 'check'; txt = h === you ? `Stuck on the ${inf.surface || 'wall'}` : `The ${inf.surface || 'wall'}`; cls = 'good'; }
    }
    const key = ic + txt + cls + (h ? h.layer : '');
    if (key === infoKey) return;
    infoKey = key;
    const el = $('[data-info]', ui);
    if (el) {
      el.className = 'info hint-chip ' + cls;
      el.innerHTML = `${icon(ic, 1)}<span>${esc(txt)}</span>${h && inf && inf.ok ? layerBars(h.layer) : ''}`;
    }
  }
  const layerBars = li => `<span class="layers" title="${cap(LAYER_NAMES[li])} layer" aria-label="${cap(LAYER_NAMES[li])} layer">${[2, 1, 0].map(k => `<i class="${k === li ? 'on' : ''}"></i>`).join('')}</span>`;

  /* --- colours --- */
  function onYou(px, py) {
    if (!you) return false;
    const [ox, oy] = layerShift(you.layer, WST.cam.cx, WST.cam.cy);
    return inMask(you, px - ox - you.x, py - oy - you.y);
  }
  function colourAt(sx, sy) {
    const [px, py] = camToScene(WST.cam, sx, sy), pk = pickScene(S, px, py, WST.cam.cx, WST.cam.cy);
    if (!pk) return null;
    if (pk.li <= you.layer && onYou(px, py)) return -1;
    return pk.idx;
  }
  function pick(sx, sy) {

  // The best match these colours could give, and how much of you each one would cover.

    const D = sceneDist(S), n = S.DN, cells = blankCells(you.pose), use = [0, 0, 0, 0];
    for (const k of P.cells) {

      for (const pc of picked) { const e = D[pc[0] * n + out[k]]; if (e < be) { be = e; best = pc; } }
      cells[k] = best[0]; use[best[1]]++;
    }

    return { q, use: use.map(u => u / P.cells.length) };
  }
  const useless = i => step === 'colours' && fit && cols[i] !== null && fit.use[i] < 0.03;
  const slotsHtml = (showUse) => `<div class="slots" role="group" aria-label="Your four colours">${cols.map((c, i) => `<button type="button" class="slot${i === slot ? ' on' : ''}${c === null ? ' empty' : ''}${useless(i) ? ' bad' : ''}" data-slot="${i}" aria-pressed="${i === slot}" aria-label="Colour ${i + 1}${c === null ? ', empty' : useless(i) ? ', not behind you' : ''}"><i style="${c === null ? '' : 'background:' + S.hexes[c]}"></i><b>${i + 1}</b>${showUse && fit && c !== null ? `<u style="width:${Math.round(Math.min(1, fit.use[i] * 1.6) * 100)}%"></u>` : ''}${useless(i) ? `<em>${icon('x', 1)}</em>` : ''}</button>`).join('')}</div>`;

  /* --- paint --- */
  const aimCam = z => aimAt(you, z);
  const paintAim = () => aimAt(you, 8, 0, 7.5);   // you sit a little above the middle, clear of the controls
  function cellAt(sx, sy) {
    const [px, py] = camToScene(WST.cam, sx, sy), [ox, oy] = layerShift(you.layer, WST.cam.cx, WST.cam.cy);
    return [Math.floor(px - ox - you.x), Math.floor(py - oy - you.y)];
  }
  function dab(i, j) {
    const P = POSES[you.pose], c = cols[slot], r = brush === 2 ? 1 : 0;
    if (c === null) return;
    for (let y = j - r; y <= j + r; y++) for (let x = i - r; x <= i + r; x++) {
      if (x < 0 || y < 0 || x >= P.w || y >= P.h) continue;
      const k = y * P.w + x;
      if (P.mask[k] === 1 && you.cells[k] !== c) { you.cells[k] = c; you.ver++; }
    }
  }
  function strokeTo(sx, sy) {
    const [i, j] = cellAt(sx, sy);
    if (stroke) {
      const n = Math.max(Math.abs(i - stroke[0]), Math.abs(j - stroke[1]));
      for (let k = 1; k <= n; k++) dab(Math.round(stroke[0] + (i - stroke[0]) * k / n), Math.round(stroke[1] + (j - stroke[1]) * k / n));
      if (!n) dab(i, j);
    } else dab(i, j);
    stroke = [i, j];
  }
  function startPaint() {
    painting = true; tEnd = performance.now() + PAINT_SECONDS * 1000; over.innerHTML = '';
    renderDock();
  }
  function finishPaint() {
    if (step !== 'paint') return;
    painting = false; stroke = null;
    score = scoreHide(S, you);
    step = 'check'; checkT0 = performance.now();
    renderAll();
  }
  function lockIn() {
    ST.hides[d] = { t: Date.now(), layer: you.layer, x: you.x, y: you.y, pose: you.pose, cells: Array.from(you.cells), whistle, q: score.q, v: score.v };
    saveState();
    $$('button', ui).forEach(b => { b.disabled = true; });
    stamp('Hidden!', 'go-stamp');
    setTimeout(() => { if (cur && cur.name === 'hide') go('home'); }, REDUCED ? 700 : 1500);
  }

  /* --- the dock for each step --- */
  function renderAll() {
    const k = step === 'done' ? 4 : STEP_ICONS.findIndex(s => s[0] === step);
    $('[data-pips]', ui).innerHTML = STEP_ICONS.map((s, i) => `<li class="${i < k ? 'past' : i === k ? 'on' : ''}" title="${s[2]}">${icon(i < k ? 'check' : s[1], 1)}</li>`).join('');
    WST.pan = step === 'place' || step === 'colours';
    WST.zoom = step === 'place' || step === 'colours';
    world.classList.toggle('aim', step === 'colours' || step === 'paint');
    $('[data-zoomslot]', ui).innerHTML = WST.zoom ? zoomButtons() : '';
    if (step === 'colours') { const [cx, cy] = aimCam(4); camLook(WST.cam, cx, cy, 4); }
    if (step === 'paint') { const [cx, cy] = paintAim(); camLook(WST.cam, cx, cy, 8); }
    if (step === 'done') { const [cx, cy] = aimCam(3); camLook(WST.cam, cx, cy, 3); }
    renderDock();
    if (step === 'paint' && !painting) {
      over.innerHTML = `<div class="card paint-card"><div class="bignum"><b class="num">${PAINT_SECONDS}</b><span>seconds</span></div><p class="note">One go, no undo. Copy what shows through you.</p><div class="col">${btn('Go', 'data-act="startpaint" data-af', 'go', 'brush')}${btn('Colours', 'data-act="tocolours"', 'alt small-btn')}</div></div>`;
      focusFirst(over);
    } else over.innerHTML = '';
  }
  function lead(html) { $('[data-lead]', ui).innerHTML = html; }
  function hint(ic, txt, cls) { const el = $('[data-info]', ui); el.hidden = !ic; if (ic) { el.className = 'info hint-chip ' + (cls || ''); el.innerHTML = `${icon(ic, 1)}<span>${esc(txt)}</span>`; } }
  function renderDock() {
    infoKey = '';
    if (step === 'place') {
      $('[data-info]', ui).hidden = false;
      lead(chip(`${icon('pin', 1)}Pick a spot`, 'hud-chip'));
      dock.innerHTML = `<div class="row"><div class="row poses" role="group" aria-label="Pose">${POSE_IDS.map(p => `<button type="button" class="pose${p === pose ? ' on' : ''}" data-pose="${p}" aria-pressed="${p === pose}" aria-label="${cap(p)} pose">${icon('pose-' + p, 2)}</button>`).join('')}</div>
        ${btn('Next', `data-act="colours"${you && you.info.ok ? '' : ' disabled'}`, 'go')}</div>`;
      spotInfo();
    } else if (step === 'colours') {
      lead(chip(`${icon('dropper', 1)}Pick 4 colours`, 'hud-chip'));
      const bad = cols.findIndex((c, i) => useless(i)), n = cols.filter(c => c !== null).length;
      if (bad >= 0) hint('x', `Colour ${bad + 1} isn't behind you. Tap it, then pick one from the circle.`, 'bad');
      else if (!n) hint('dropper', TOUCHY ? 'Copy colours from inside the circle. Touch, slide, let go.' : 'Copy colours from inside the circle. Click to pick.');
      else if (n < 4) hint('dropper', `${4 - n} more. Pick the colours you see most around you.`);
      else hint('check', fit && fit.q >= 0.7 ? 'Good colours. Press Next to paint.' : 'Press Next, or tap a colour to swap it.', fit && fit.q >= 0.7 ? 'good' : '');
      const fq = fit ? fit.q : 0;
      dock.innerHTML = `${slotsHtml(true)}
        <div class="fit" aria-label="Best match with these colours ${pct(fq)}"><span>Best match with these</span><i><i class="${fq >= 0.8 ? 'hi' : fq >= 0.5 ? 'mid' : 'lo'}" style="width:${Math.round(fq * 100)}%"></i></i><b class="num">${fit ? Math.round(fq * 100) + '%' : '-'}</b></div>
        <div class="row between">${btn('Back', 'data-act="back"', 'alt')}${btn('Next', `data-act="paint"${n ? '' : ' disabled'}`, 'go')}</div>`;
    } else if (step === 'paint') {
      hint('brush', 'Copy what shows through you');
      lead(chip(`${icon('clock', 1)}<b class="num" data-clock>${PAINT_SECONDS}</b>`, 'hud-chip', 'data-clockbox') + chip(`${icon('eye', 1)}<b class="num" data-live>${liveQ === null ? '0' : Math.round(liveQ * 100)}%</b>`, 'hud-chip live', 'title="Match so far"'));
      lastSec = -1;
      dock.innerHTML = `${slotsHtml().replace(/<button type="button" class="slot[^"]*empty[^"]*"[^>]*>.*?<\/button>/g, '')}
        <div class="row between"><div class="row" role="group" aria-label="Brush">
          <button type="button" class="tool${brush === 1 ? ' on' : ''}" data-brush="1" aria-pressed="${brush === 1}" aria-label="Small brush">${icon('small', 2)}</button>
          <button type="button" class="tool${brush === 2 ? ' on' : ''}" data-brush="2" aria-pressed="${brush === 2}" aria-label="Big brush">${icon('big', 2)}</button>
          <button type="button" class="tool peek${peek ? ' on' : ''}" data-peek aria-label="Hold to see what's behind you" title="Hold to see behind you">${icon('eye', 2)}</button>
        </div>${btn('Done', `data-act="donepaint"${painting ? '' : ' disabled'}`, 'go')}</div>`;
    } else {
      const P0 = POSES[you.pose], gaps = P0.cells.filter(k => you.cells[k] === EMPTY).length / P0.cells.length, q0 = score ? score.q : 0;
      if (step === 'done') hint(null);
      else if (gaps > 0.08) hint('x', `${Math.round(gaps * 100)}% of you is still white. Hunters spot white fast.`, 'warn');
      else if (q0 < 0.5) hint('x', "Your colours don't match what's behind you.", 'warn');
      else if (q0 >= 0.8) hint('star', 'Great disguise!', 'good');
      else hint('eye', 'Not bad. Sharp eyes might catch your edges.');
      const p = score ? score : { q: 0, v: 0 }, CC = crowd(d), likely = CC.tierOf(Math.min(0.85, FINDS_PER_HUNTER * weightOf(Object.assign({}, p, { whistle })) / CC.sumW));
      lead(chip(`${icon(step === 'done' ? 'lock' : 'eye', 1)}${step === 'done' ? 'Hidden' : 'Check'}`, 'hud-chip'));
      dock.innerHTML = `<div class="check">
          <div class="gauge" role="img" aria-label="Match ${pct(p.q)}">${gauge(p.q)}<b class="num">${Math.round(p.q * 100)}</b><span>match</span></div>
          <div class="facts">
            <p>${icon('eye', 1)}<span>Visible</span><b>${pct(p.v)}</b></p>
            <p>${icon('star', 1)}<span>Rarity</span>${tierBadge(likely)}</p>
            <p>${icon('trophy', 1)}<span>Points</span><b>${fmt(hiderPoints(likely, p.v, whistle))}</b></p>
            <button type="button" class="toggle${whistle ? ' on' : ''}" data-act="whistle" aria-pressed="${whistle}" ${step === 'done' ? 'disabled' : ''}>${icon('eye', 1)}<span>Whistle</span><em>x2 points, eye blinks</em></button>
          </div>
        </div>
        <div class="row between">${btn('', `data-act="where" aria-pressed="${where}" aria-label="Where am I?" title="Where am I?"`, 'round alt' + (where ? ' on' : ''), 'pin')}${step === 'done' ? btn('Home', 'data-act="home" data-af', 'go') : btn('Lock in', 'data-act="lock" data-af', 'go', 'lock')}</div>`;
    }
  }
  const gauge = q => { const r = 26, c = 2 * Math.PI * r; return `<svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true"><circle cx="32" cy="32" r="${r}" class="g0"/><circle cx="32" cy="32" r="${r}" class="g1 ${q >= 0.8 ? 'hi' : q >= 0.5 ? 'mid' : 'lo'}" stroke-dasharray="${(c * q).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 32 32)"/></svg>`; };

  ui.onclick = e => {
    if (zoomClick(e)) return;
    const b = e.target.closest('button');
    if (!b || b.disabled) return;
    if (b.dataset.pose) return setPose(b.dataset.pose);
    if (b.dataset.slot) { slot = +b.dataset.slot; return renderDock(); }
    if (b.dataset.brush) { brush = +b.dataset.brush; return renderDock(); }

    else if (a === 'back') { step = 'place'; camLook(WST.cam, W / 2, H / 2, 1); renderAll(); }

  };
  // Start you somewhere good, so Next works straight away. Tap anywhere else to move.
  if (!saved) {
    const r = rng('first-spot', d, ST.uid || 0), rect = { bottom: H - 150 };
    for (let n = 0; n < 3000 && !you; n++) {
      const g = ghostAt(30 + r() * (W - 90), 90 + r() * (rect.bottom - 90));
      if (g && g.info.ok && g.info.stick >= 0.99 && g.info.covered < 0.05 && g.layer >= 1) you = { id: 'you', name: 'You', you: true, layer: g.layer, x: g.x, y: g.y, pose, cells: blankCells(pose), ver: 1, info: g.info };

  }
  renderAll();

  function spotlight(ctx, b) {
    const rx = Math.max(b.w, b.h) * 0.75 + 30, ry = rx * 0.8, cx = b.x + b.w / 2, cy = b.y + b.h / 2;

  }
  function drawLoupe(t) {
    if (WST.mx === undefined || !(WST.over || (WST.down && WST.touch))) return;

    const R = 5, Z = 7, size = (2 * R + 1) * Z;

    lx = clamp(lx, 6, W - size - 6); if (ly < 50) ly = Math.min(H - size - 110, WST.my + 30);
    wctx.save(); wctx.scale(DPR, DPR); wctx.imageSmoothingEnabled = false;

    wctx.restore();
    wctx.save(); wctx.imageSmoothingEnabled = false;
    const cellPx = WST.cam.z * DPR, srcW = (2 * R + 1) * cellPx;
    wctx.drawImage(world, Math.round(WST.mx * DPR - srcW / 2), Math.round(WST.my * DPR - srcW / 2), srcW, srcW, lx * DPR, ly * DPR, size * DPR, size * DPR);
    wctx.restore();
    wctx.save(); wctx.scale(DPR, DPR);
    wctx.strokeStyle = '#1D1A2B'; wctx.lineWidth = 2; wctx.strokeRect(lx + R * Z - 1, ly + R * Z - 1, Z + 2, Z + 2);

    wctx.restore();
  }
  function drawEye(t) {
    const P = POSES[you.pose];
    const [cx, cy] = aimCam(2);
    camLook(eyeCam, cx, cy, 2);
    drawScene(eye.ctx, S, eyeCam, [{ h: you, kind: 'paint', blink: false }], t);
    const bw = 62, bh = Math.round(bw * H / W), bx = W - bw - 10, by = 46;
    wctx.save(); wctx.scale(DPR, DPR);

  return {
    leave() { window.removeEventListener('pointerup', unpeek); window.removeEventListener('pointercancel', unpeek); },
    frame(t, dt) {

        if (t - liveT > 250) { liveT = t; liveQ = scoreHide(S, you).q; const el = $('[data-live]', ui); if (el) el.textContent = Math.round(liveQ * 100) + '%'; }

      if (step === 'check' || step === 'done') {

        if (step === 'check' && !REDUCED && e < 1100) camLook(WST.cam, W / 2, H / 2, 1);
        else { const [cx, cy] = aimCam(3); camLook(WST.cam, cx + (REDUCED ? 0 : Math.sin((e - 1100) / 1300) * 40), cy, 3); }
      } else camStep(WST.cam, dt);

      if (step === 'place') {

          wctx.save(); wctx.scale(DPR, DPR); wctx.lineWidth = 2; wctx.strokeStyle = '#FFFFFF'; wctx.strokeRect(sx, sy, (2 * r + 1) * WST.cam.z, (2 * r + 1) * WST.cam.z);
          wctx.lineWidth = 1; wctx.strokeStyle = '#1D1A2B'; wctx.strokeRect(sx - 1.5, sy - 1.5, (2 * r + 1) * WST.cam.z + 3, (2 * r + 1) * WST.cam.z + 3); wctx.restore();

      if (step === 'place') spotInfo();

        const top = dock.getBoundingClientRect().top - world.getBoundingClientRect().top;

      }
    },
    key(e, down) {
      if ((step === 'place' || step === 'colours') && zoomKeys(e, down)) return true;
      if (!down && (e.key === 'p' || e.key === 'P')) { peek = false; return true; }
      if (!down) return false;
      const m = /^[1-4]$/.exec(e.key);

};
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

/* ---------- vote ---------- */

/* ---------- the reveal, when the day turns ---------- */

// d0 is the day that just ended. Its hunt was on crowd(d0 - 1), the picture everyone hid in the day before.
SCREENS.reveal = (d0) => {
  if (d0 === undefined) d0 = ST.day - 1;
  const C = crowd(d0 - 1), S = C.S, hunt = ST.hunts[d0], gf = goldFinders(d0), vr = voteResult(d0);
  const mine = userHide(d0 - 1), myRes = mine ? rateYourHide(C, mine) : null, pending = userHide(d0);
  const best = C.hides.slice().sort((a, b) => a.found - b.found || b.q - a.q).slice(0, 3);

          ${btn('Copy to share', `data-copy="${esc(n ? `I hid in plain sight on ${channel()}. ${n / C.hunters < 0.05 ? 'Only ' : ''}${fmt(n)} of ${fmt(C.hunters)} hunters found me.` : `I hid in plain sight on ${channel()}. None of the ${fmt(C.hunters)} hunters found me.`)}"`, 'alt slim-btn')}`;
      }
      if (pending) return `<p class="kicker">Your hide</p><h2>Being hunted now</h2><p class="note">${fmt(crowd(d0).hunters)} hunters are looking for you today. Results at 7pm tomorrow.</p>`;

        <ol class="podium">${first.slice(0, 3).map((f, i) => `<li class="${f.you ? 'you' : ''}"><span class="num">${i + 1}</span><b>${esc(f.name)}</b><em>${f.secs}s</em></li>`).join('')}</ol>`;

/* ---------- scores ---------- */

  const list = (rows, fa, fb, ha, hb) => {

    const pinned = rows.map((r, i) => [r, i]).filter(([r]) => r.you || r.streamer);

    for (let n = 0; n < 3; n++) top = 8 - pinned.filter(([, i]) => i >= top).length;
    const extra = pinned.filter(([, i]) => i >= top);
    let html = rows.slice(0, top).map((r, i) => row(i + 1, r, fa(r), fb(r))).join('');
    if (extra.length) html += '<li class="gap" aria-hidden="true"></li>' + extra.map(([r, i]) => row(fmt(i + 1), r, fa(r), fb(r))).join('');

  };
  if (tab === 'hunters') {
    const B = hunterBoard(d), rows = B.rows.map(r => Object.assign({}, r)), h = ST.hunts[d];

    rows.push({ name: channel(), finds: sh.finds, pts: sh.pts, secs: 60, streamer: true });

    body = list(rows, r => r.finds, r => fmt(r.pts), 'Found', 'Points') + `<p class="note">${fmt(B.total)} hunters today.${h ? '' : ' Hunt to get on the board.'}</p>`;

    const C = crowd(d - 2), rows = C.hides.map(h => ({ name: h.name, found: h.found, tier: h.tier }));

    if (y) { const r = rateYourHide(C, y); rows.push({ name: 'You', found: r.found, tier: r.tier, you: true }); }
    rows.sort((a, b) => a.found - b.found);
    body = list(rows, r => `<i class="dot t-${r.tier}"></i>`, r => fmt(Math.round(r.found * C.hunters)), '', 'Found by') + `<p class="note">Fewest hunters found them in ${C.S.name}, out of ${fmt(C.hunters)}.</p>`;
  }

  ui.innerHTML = `<div class="sheet">
    <div class="sheet-head"><h2>${icon('trophy', 2)}Scores</h2>${btn('', 'data-act="home" aria-label="Close"', 'round alt', 'x')}</div>
    <div class="tabs" role="tablist">${TABS.map(([k, ic, label]) => `<button type="button" role="tab" class="tab" aria-selected="${k === tab}" data-tab="${k}">${icon(ic, 1)}${label}</button>`).join('')}</div>

    if (b) go(b.dataset.act);
  };
  const S = crowd(d - 1).S;
  WST.pan = false; WST.zoom = false;
  return { frame(t) { drawScene(wctx, S, WST.cam, [], t); } };
};

/* ---------- the mock stream ---------- */

let streamRAF = 0, streamBack = null;
function openStream() {
  const el = $('#stream'), d0 = ST.day - 1, C = crowd(d0 - 1), S = C.S, gf = goldFinders(d0);
  streamBack = document.activeElement;
  el.hidden = false;
  const cv = $('.stream-pic', el), ctx = cv.getContext('2d');
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  const best = C.hides.slice().sort((a, b) => a.found - b.found).slice(0, 3);
  $('[data-ov]', el).innerHTML = `
    <div class="ov-card"><p class="kicker">Plain Sight</p><h3><span data-scount>0</span> hid in ${S.name}</h3></div>
    <div class="ov-card"><p class="kicker">Best hiders</p><ol class="podium">${best.map((h, i) => `<li><span class="num">${i + 1}</span><b>${esc(h.name)}</b><em>${fmt(Math.round(h.found * C.hunters))} found</em></li>`).join('')}</ol></div>
    <div class="ov-card gold"><p class="kicker">${icon('crown', 1)} First to find ${esc(channel())}</p><ol class="podium">${gf.first.map((f, i) => `<li><span class="num">${i + 1}</span><b>${esc(f.name)}</b><em>${f.secs}s</em></li>`).join('')}</ol></div>`;
  $('.facecam span', el).textContent = channel();
  const cam = makeCam(), t0 = performance.now();
  const loop = t => {
    const e = (t - t0) % 9000, line = clamp(e / 3200, 0, 1) * (H + 20);
    const list = C.all.map(h => { const b = h.y + POSES[h.pose].h / 2; return { h, kind: b < line ? (h.streamer ? 'gold' : 'true') : 'paint' }; });
    drawScene(ctx, S, cam, list, t);
    const n = list.filter(it => it.kind !== 'paint').length, c = $('[data-scount]', el);
    if (c) c.textContent = n;
    streamRAF = requestAnimationFrame(loop);
  };
  streamRAF = requestAnimationFrame(loop);
  $('[data-close]', el).focus();
}
function closeStream() {
  cancelAnimationFrame(streamRAF);
  $('#stream').hidden = true;
  if (streamBack && streamBack.focus) streamBack.focus();
}

/* ---------- demo controls and start-up ---------- */

function demoLabels() {
  $('[data-demo-day]').textContent = `Day ${ST.day}`;
  const inp = $('#channel-name');
  if (document.activeElement !== inp) inp.value = channel();
}
function demo(a) {
  if (a === 'skip') { ST.day++; saveState(); demoLabels(); go('reveal', ST.day - 1); }
  else if (a === 'reset') { try { localStorage.removeItem(STORE); } catch (e) { /* ignore */ } ST = freshState(); for (const k in MEMO.hunters) delete MEMO.hunters[k]; demoLabels(); go('home'); }
  else if (a === 'stream') openStream();
}

let lastT = 0;
function loop(t) {
  const dt = Math.min(0.05, (t - (lastT || t)) / 1000);
  lastT = t;
  try { if (cur && cur.frame) cur.frame(t, dt); } catch (e) { console.error(e); }
  requestAnimationFrame(loop);
}

function init() {
  ST = loadState();
  CHANNEL = channel();
  panel = $('#panel'); ui = $('#ui');
  const w = screenCanvas(W, H, 'world');
  world = w.c; wctx = w.ctx;
  world.tabIndex = 0;
  world.setAttribute('aria-label', 'The picture. Drag to look around, scroll or pinch to zoom.');
  panel.prepend(world);
  bindInput(world, WST, new Proxy({}, { get: (_, k) => WH[k] }));
  demoLabels();
  $('.demo').addEventListener('click', e => { const b = e.target.closest('[data-demo]'); if (b) demo(b.dataset.demo); });
  let nameT = 0;
  $('#channel-name').addEventListener('input', e => {
    ST.channel = e.target.value.replace(/[<>]/g, '').trim().slice(0, 20) || 'Streamer';
    CHANNEL = ST.channel;
    for (const k in MEMO.hunters) delete MEMO.hunters[k];
    saveState();
    clearTimeout(nameT);
    nameT = setTimeout(() => { if (cur && ['home', 'scores'].includes(cur.name)) go(cur.name); }, 300);
  });
  $('#stream').addEventListener('click', e => { if (e.target.closest('[data-close]') || e.target.id === 'stream') closeStream(); });
  window.addEventListener('keydown', e => {
    if (!$('#stream').hidden) { if (e.key === 'Escape') closeStream(); return; }
    if (e.target && e.target.id === 'channel-name') return;
    if (cur && cur.key && cur.key(e, true)) e.preventDefault();
  });
  window.addEventListener('keyup', e => { if (cur && cur.key && cur.key(e, false)) e.preventDefault(); });
  go('home');
  requestAnimationFrame(loop);
  window.PS = { go, get ST() { return ST; }, cur: () => cur, demo };
}

const fontsReady = document.fonts ? Promise.all([
  document.fonts.load('600 12px Fredoka'), document.fonts.load('700 12px Fredoka'), document.fonts.load('400 12px Silkscreen'),
]).catch(() => null) : Promise.resolve();
Promise.race([fontsReady, new Promise(r => setTimeout(r, 1500))]).then(init);

</script>
